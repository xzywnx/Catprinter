<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MXW01 Tools - Cat Printer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>MXW01 Tools</h1>
      <div class="mode-switch">
        <button id="btnReceiptMode" class="btn-mode active">Receipt Mode</button>
        <button id="btnImageMode" class="btn-mode">Image Mode</button>
      </div>
    </header>

    <!-- RECEIPT MODE -->
    <section id="receiptSection" class="card">
      <h2>DATA RESEP / STRUK</h2>
      <div class="form-group">
        <label>Header / Nama Toko</label>
        <input type="text" id="storeName" value="123 MAIN STREET, CITY, STATE 12345">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="storePhone" value="(555) 123-4567">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Table</label>
          <input type="text" id="receiptTable" value="12">
        </div>
        <div class="form-group">
          <label>Server</label>
          <input type="text" id="receiptServer" value="ALICE">
        </div>
        <div class="form-group">
          <label># Order</label>
          <input type="text" id="receiptOrder" value="1234">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tax %</label>
          <input type="number" id="receiptTax" value="8.25" step="0.01">
        </div>
        <div class="form-group">
          <label>Date/Time</label>
          <input type="text" id="receiptDate">
        </div>
      </div>

      <!-- ADD ITEM FORM -->
      <div class="form-group">
        <label>Items</label>
        <div class="item-input-row">
          <input type="text" id="itemNameInput" placeholder="Item name">
          <input type="number" id="itemPriceInput" placeholder="0.00" step="100">
          <button id="btnAddItem" class="btn-blue-sm">Add</button>
        </div>
        <ul id="itemListUI" class="item-list"></ul>
      </div>

      <!-- PAYMENT -->
      <div class="form-row">
        <div class="form-group">
          <label>Tip</label>
          <input type="number" id="receiptTip" value="0.00">
        </div>
        <div class="form-group">
          <label>Method</label>
          <select id="paymentMethod">
            <option value="Credit Card">Credit Card</option>
            <option value="Cash">Cash</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Paid</label>
          <input type="number" id="receiptPaid" value="0.00">
        </div>
        <div class="form-group">
          <label>Change</label>
          <input type="text" id="receiptChange" value="0.00" readonly>
        </div>
      </div>

      <div class="form-group">
        <label>Footer</label>
        <textarea id="footerText" rows="2">THANK YOU FOR DINING WITH US
WWW.MYRESTAURANT.COM</textarea>
      </div>

      <button id="btnResetReceipt" class="btn-gray">Reset Form</button>
    </section>

    <!-- IMAGE MODE -->
    <section id="imageSection" class="card hidden">
      <h2>IMAGE SOURCE & PROCESSING</h2>
      <div class="form-group">
        <label>Upload Image</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      
      <div class="form-group">
        <label>Dithering Method</label>
        <select id="ditherMethod">
          <option value="floyd">Floyd-Steinberg</option>
          <option value="threshold">Threshold</option>
        </select>
      </div>

      <div class="form-group">
        <label>Threshold: <span id="thresholdVal">128</span></label>
        <input type="range" id="thresholdSlider" min="0" max="255" value="128">
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="invertCheckbox">
        <label for="invertCheckbox">Invert Image</label>
      </div>
    </section>

    <!-- ACTION BUTTONS -->
    <div class="action-buttons">
      <button id="btnConnect" class="btn-blue">Reconnect / Connect BLE</button>
      <button id="btnPrint" class="btn-red">Print Now</button>
    </div>

    <!-- PREVIEW -->
    <section class="card">
      <h2>PRINT PREVIEW</h2>
      <div class="canvas-container">
        <canvas id="printCanvas" width="384" height="100"></canvas>
      </div>
      <div id="previewMetrics" class="metrics-panel"></div>
    </section>

    <!-- LOG -->
    <section class="card">
      <div class="log-header">
        <h2>PRINTER LOG</h2>
        <span id="batteryStatus" class="battery-label">🔋 --%</span>
      </div>
      <pre id="logArea">Status: Ready to connect</pre>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
